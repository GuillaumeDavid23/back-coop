monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - payment # Stripe/paiement/facturation - canal dédié, toujours en détail (voir plus bas)

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!payment"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            payment:
                type: stream
                path: "%kernel.logs_dir%/payment.log"
                level: debug
                channels: [payment]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!payment"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Toujours en détail (debug), même en prod : un souci de paiement se
            # diagnostique après coup, on ne peut pas se permettre de n'avoir que
            # les erreurs. Fichier dédié pour ne pas noyer les vrais incidents
            # applicatifs remontés par le handler "main".
            payment:
                type: stream
                channels: [payment]
                path: "%kernel.logs_dir%/payment.log"
                level: debug
                formatter: monolog.formatter.json
