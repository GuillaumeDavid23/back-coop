monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - payment # Stripe/paiement/facturation - canal dédié, toujours en détail (voir plus bas)

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!payment"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            payment:
                type: stream
                path: "%kernel.logs_dir%/payment.log"
                level: debug
                channels: [payment]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!payment"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Toujours en détail (debug), même en prod : un souci de paiement se
            # diagnostique après coup, on ne peut pas se permettre de n'avoir que
            # les erreurs. Fichier dédié pour ne pas noyer les vrais incidents
            # applicatifs remontés par le handler "main".
            payment:
                type: stream
                channels: [payment]
                path: "%kernel.logs_dir%/payment.log"
                level: debug
                formatter: monolog.formatter.json
            # Alerte par email sur incident critique : erreur 500, exception non
            # rattrapée, ou log critical applicatif (ex: une facture émise dont
            # le PDF est introuvable au moment de l'envoi). Sur le mutualisé,
            # "nested" écrit sur php://stderr, qui ne va nulle part : sans cette
            # alerte, un incident reste invisible jusqu'à ce qu'un client le
            # signale, ce qui a coûté une semaine de confirmations perdues.
            #
            # Le canal "payment" est inclus volontairement, c'est là que se
            # loguent les incidents de facturation.
            critical_alert:
                type: fingers_crossed
                action_level: critical
                handler: critical_alert_deduplicated
                channels: ["!deprecation", "!event", "!doctrine"]
                # Contexte joint à l'alerte : les 30 derniers logs de la requête,
                # ce qui suffit à reconstituer ce qui a mené à l'erreur.
                buffer_size: 30
                excluded_http_codes: [404, 405]
            # Une même erreur qui se répète (Stripe qui rejoue son webhook, base
            # injoignable) ne génère qu'une alerte toutes les 10 minutes, plutôt
            # que de noyer la boîte au moment précis où il faut réagir.
            critical_alert_deduplicated:
                type: deduplication
                handler: critical_alert_mailer
                time: 600
                nested: true
            critical_alert_mailer:
                type: symfony_mailer
                # Expéditeur déjà autorisé côté Brevo, comme les confirmations
                # d'inscription : une alerte refusée par le relais SMTP ne
                # préviendrait personne.
                from_email: 'ne-pas-repondre@clcomevents.fr'
                to_email: '%env(ALERT_EMAIL)%'
                subject: '[back-coop] Erreur critique : %%message%%'
                level: debug
                formatter: monolog.formatter.html
                content_type: text/html
                nested: true
