framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # Un worker tué en cours de traitement (crash, fin de cron,
                    # redémarrage) laisse le message "en cours de livraison".
                    # 300s au lieu de l'heure par défaut : une facture et son
                    # mail ne doivent pas attendre 1h à cause d'un worker coupé.
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Les emails partent en synchrone, dans la requête qui les déclenche
            # (aucune ligne de routage : un message non routé est traité
            # immédiatement). Sur mutualisé, cela évite de dépendre du worker
            # pour la confirmation d'inscription - au prix de l'absence de
            # rejeu automatique si le serveur SMTP est momentanément injoignable.
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # La génération du PDF de facture reste asynchrone : wkhtmltopdf
            # dépasse régulièrement le délai d'attente du webhook Stripe.
            App\Message\GenerateInvoicePdfMessage: async
