# Environnement de développement local UNIQUEMENT. La production tourne sur
# de l'hébergement mutualisé IONOS sans root/sudo : pas de Docker en prod,
# déploiement par upload classique (voir README.md).
name: clcom-events

services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://${MYSQL_USER:-clcom}:${MYSQL_PASSWORD:-clcom_secret}@db:3306/${MYSQL_DATABASE:-clcom_events}?serverVersion=8.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailpit:1025"
    depends_on:
      db:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "bin/console", "messenger:consume", "async", "-vv"]
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://${MYSQL_USER:-clcom}:${MYSQL_PASSWORD:-clcom_secret}@db:3306/${MYSQL_DATABASE:-clcom_events}?serverVersion=8.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailpit:1025"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clcom_events}
      MYSQL_USER: ${MYSQL_USER:-clcom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-clcom_secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
